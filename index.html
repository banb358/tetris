<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TETRA PUZZLE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <div class="overlay-content">
                <h1 class="logo">TETRA<br>PUZZLE</h1>
                <p class="tagline">PRESS START TO PLAY</p>
                <button id="start-btn" class="primary-btn">START GAME</button>
            </div>
        </div>

        <div class="game-wrapper">
            <!-- Left Panel -->
            <div class="side-panel left">
                <div class="panel-box">
                    <h2>SCORE</h2>
                    <div id="score">0</div>
                </div>
                <div class="panel-box">
                    <h2>LEVEL</h2>
                    <div id="level">1</div>
                </div>
            </div>

            <!-- Main Game Area -->
            <div class="main-canvas">
                <canvas id="tetris" width="240" height="400"></canvas>
                <div id="game-over" class="overlay hidden">
                    <div class="overlay-content">
                        <h1>GAME OVER</h1>
                        <button id="restart-btn" class="primary-btn">RETRY</button>
                    </div>
                </div>
                <div id="game-clear" class="overlay hidden">
                    <div class="overlay-content">
                        <h1 class="win-title">GAME CLEAR!</h1>
                        <p class="win-text">レベル1 クリア！おめでとう！</p>
                        <p class="win-msg">テトラパズルマスターへの道、第一歩を達成しました。<br>サクッと遊んでくれてありがとう。<br>素晴らしいパズルさばきでした！</p>
                        <button id="win-btn" class="primary-btn">PLAY AGAIN</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="side-panel right">
                <div class="panel-box">
                    <h2>NEXT</h2>
                    <canvas id="next" width="100" height="100"></canvas>
                </div>
                <div class="panel-box">
                    <h2>LINES</h2>
                    <div id="lines">0</div>
                </div>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <div class="control-row">
                <button id="btn-rotate" class="ctrl-btn">↻</button>
            </div>
            <div class="control-row">
                <button id="btn-left" class="ctrl-btn">←</button>
                <button id="btn-down" class="ctrl-btn">↓</button>
                <button id="btn-right" class="ctrl-btn">→</button>
            </div>
            <div class="control-row">
                <button id="btn-hard-drop" class="ctrl-btn long">HARD DROP</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/constants.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
